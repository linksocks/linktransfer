name: CI

"on":
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.md"
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [review_requested]
    paths-ignore:
      - "*.md"

jobs:
  tests:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile="coverage.txt" -covermode=atomic -coverpkg="./internal/linktransfer" "./internal/linktransfer/..."